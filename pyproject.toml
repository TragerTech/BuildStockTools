[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "buildstocktools"
version = "0.1.0"
description = "Access and sample NREL BuildStock datasets"
authors = [{name = "BuildStockTools Contributors"}]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "duckdb>=0.9",
    "pyarrow>=12",
    "typer>=0.12",
    "loguru>=0.7"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock"
]

[project.scripts]
buildstocktools = "buildstocktools.cli:app"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]

